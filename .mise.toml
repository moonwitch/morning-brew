[tools]
bun = "1.3.14"

# Python tooling is not needed yet. Uncomment when a Python-based source
# plugin lands; uv manages the venv from there.
# python = "3.13"
# uv = "latest"

[settings]
# Fail loudly rather than silently falling back to a system-installed bun.
experimental = false

[tasks.install]
description = "Install workspace dependencies"
run = "bun install"

[tasks.typecheck]
description = "Type-check every workspace package"
run = "bun run typecheck"

[tasks.test]
description = "Run the test suite"
run = "bun test"
